[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "networkusb"
version = "0.1.0"
description = "Async usbmuxd network tunnel — proxy iOS device socket over TCP/TLS between two Macs"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
usbmuxd-agent  = "networkusb.agent.main:app"
usbmuxd-bridge = "networkusb.bridge.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/networkusb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
